[project]
name = "mini-city"
version = "0.1.0"
description = "Sistema web de gestão da cidade MiniCidade com Streamlit, SQLAlchemy e múltiplos bancos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.0.0",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false
